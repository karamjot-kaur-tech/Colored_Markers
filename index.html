<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colored Markers</title>
    <link rel="stylesheet" href="styles.css">   <!-- Linking external CSS file -->
  </head>
  <body>
    <h1>CSS Color Markers</h1>        <!-- Page heading -->
    <div class="container">           <!-- Container to hold all markers -->
      <!-- Red Marker -->
      <div class="marker red">
        <div class="cap"></div>
        <div class="sleeve"></div>
      </div>
      <!-- Green Marker -->
      <div class="marker green">
        <div class="cap"></div>
        <div class="sleeve"></div>
      </div>
      <!-- Blue Marker -->
      <div class="marker blue">
        <div class="cap"></div>
        <div class="sleeve"></div>
      </div>
    </div>
  </body>
</html>
